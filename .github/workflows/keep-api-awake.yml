# Render's free plan puts the API to sleep after about 15 idle minutes, and the
# first visitor then waits up to a minute. This pings the live API every 10
# minutes during the day so it stays awake for visitors.
#
# Only 07:00 to 22:50 Lagos time (06:00 to 21:50 UTC): about 500 of the 750 free
# instance hours a month are used, which leaves room for the staging API. Staying
# awake 24 hours a day would use nearly all of them, and Render suspends every free
# service in the workspace when the hours run out.
#
# Scheduled runs are best effort (GitHub can delay one by a few minutes), and
# GitHub pauses scheduled workflows in a repository with no activity for 60 days.
# Run it by hand from the Actions tab (workflow_dispatch) to restart it.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 6-21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live API
        run: |
          curl --silent --show-error --fail --max-time 90 \
            --retry 2 --retry-delay 10 --retry-connrefused \
            --output /dev/null https://jobton-backend.onrender.com/
